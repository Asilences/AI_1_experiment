<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>电影问答人工评价</title>
<style>body{font:16px/1.65 system-ui;margin:24px auto;max-width:1050px;padding:0 20px;color:#182738;background:#f5f7fa}h1{font-size:26px}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #b6c3d0;border-radius:6px}button{cursor:pointer;background:#fff}button.primary{background:#125e89;color:white}section{background:white;padding:22px;margin:18px 0;border:1px solid #dce4ec;border-radius:10px}.controls,.scores{display:flex;gap:12px;flex-wrap:wrap;align-items:center}label{display:flex;flex-direction:column;font-size:14px}textarea{width:95%;height:60px}#status{color:#215f7b;white-space:pre-wrap}.answer,.reference{white-space:pre-wrap}small{color:#4b6072}a{color:#12659a}</style>
<h1>电影问答人工评价</h1>
<p>同一批100道题，每题两份匿名答案，共200份评分。请你实际核查准确性、完整性和流畅度；没有判断就留空。页面不会自动生成分数，刷新后可继续。</p>
<div class="controls"><label>评价者代号<input id="reviewer" placeholder="例如 xia 或 zhou" maxlength="40"></label><button id="load" class="primary">进入或继续评分</button><a id="download" hidden>导出原始CSV</a></div>
<p id="status" role="status"></p>
<section><b>评分说明</b><p>准确性：0＝错误，1＝部分正确，2＝事实正确；完整性：0＝没有回答，1＝有遗漏，2＝信息完整；流畅度：1＝难以阅读，2＝较差，3＝基本通顺，4＝通顺，5＝自然流畅；无依据断言：0＝没有发现，1＝发现新增且无证据的断言。参考答案由冻结知识库生成，只作核查材料，不能按字面重合程度代替事实核查。</p></section>
<div id="workspace" hidden><div class="controls"><button id="prev">上一题</button><span id="progress"></span><button id="next">下一题</button><button id="unfinished">跳到未完成</button></div><section><h2 id="question"></h2><p id="qid"></p><b>冻结知识库参考</b><p class="reference" id="reference"></p><a id="source" target="_blank" rel="noreferrer">查看电影Wikidata来源（当前页面可能晚于冻结快照）</a></section><div id="answers"></div></div>
<script>
let data, groups=[],position=0,reviewer='';
const $=id=>document.getElementById(id), fields=['accuracy_0_2','completeness_0_2','fluency_1_5','unsupported_claim_0_1'];
function message(t){$('status').textContent=t}
function key(row){return row.question_id+'|'+row.answer_position}
async function load(){reviewer=$('reviewer').value.trim();try{const r=await fetch('/api/review?reviewer='+encodeURIComponent(reviewer));data=await r.json();if(!r.ok)throw Error(data.error);const map=new Map();for(const row of data.rows){if(!map.has(row.question_id))map.set(row.question_id,[]);map.get(row.question_id).push(row)}groups=[...map.values()];position=0;$('workspace').hidden=false;$('download').hidden=false;$('download').href='/api/export?reviewer='+encodeURIComponent(reviewer);$('download').download='reviewer-'+reviewer+'.csv';render()}catch(e){message(e.message)}}
function render(){const rows=groups[position];$('progress').textContent=`第 ${position+1}/${groups.length} 题`;$('question').textContent=rows[0].question;$('qid').textContent=rows[0].question_id;$('reference').textContent=rows[0].reference;const q=rows[0].question_id.match(/^Q\d+/);$('source').hidden=!q;if(q)$('source').href='https://www.wikidata.org/wiki/'+q[0];$('answers').replaceChildren();for(const row of rows){const saved=data.scores[key(row)]||{},box=document.createElement('section'),h=document.createElement('h3'),text=document.createElement('p'),scores=document.createElement('div');h.textContent='匿名答案 '+row.answer_position;text.textContent=row.answer;text.className='answer';scores.className='scores';box.append(h,text,scores);const inputs={};['准确性 0—2','完整性 0—2','流畅度 1—5','无依据断言 0/1'].forEach((name,i)=>{const label=document.createElement('label'),select=document.createElement('select');label.textContent=name;const blank=document.createElement('option');blank.value='';blank.textContent='尚未评分';select.append(blank);const low=i===2?1:0,high=i===2?5:i===3?1:2;for(let n=low;n<=high;n++){const o=document.createElement('option');o.value=n;o.textContent=n;select.append(o)}select.value=saved[fields[i]]??'';inputs[fields[i]]=select;label.append(select);scores.append(label)});const notes=document.createElement('textarea');notes.placeholder='备注或错误事实说明（可选）';notes.value=saved.notes||'';const save=document.createElement('button');save.textContent=saved.updated_at?'保存修改':'保存这份评分';save.className='primary';save.onclick=async()=>{try{const payload={reviewer,question_id:row.question_id,answer_position:Number(row.answer_position),notes:notes.value};for(const f of fields){if(inputs[f].value==='')throw Error('四项均需实际评分，不能用空白当0分');payload[f]=Number(inputs[f].value)}save.disabled=true;const r=await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),reply=await r.json();if(!r.ok)throw Error(reply.error);data.scores[key(row)]=payload;save.textContent='已保存，可修改';message(`已保存 ${reply.completed_answers}/${reply.total_answers} 份答案评分。原始记录：${data.output_dir}`)}catch(e){message(e.message)}finally{save.disabled=false}};box.append(document.createElement('br'),notes,document.createElement('br'),save);$('answers').append(box)}message(`已完成 ${Object.keys(data.scores).length}/${data.rows.length} 份答案评分。请先保存当前修改，再切换题目。`)}
$('load').onclick=load;$('prev').onclick=()=>{if(position>0){position--;render()}};$('next').onclick=()=>{if(position<groups.length-1){position++;render()}};$('unfinished').onclick=()=>{const n=groups.findIndex(rows=>rows.some(r=>!data.scores[key(r)]));if(n<0){message('全部评分已保存。可导出CSV，交回项目进行校验与统计。');return}position=n;render()};
</script></html>
