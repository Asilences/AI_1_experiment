name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装检查依赖
        run: python -m pip install -r requirements-ci.txt

      - name: 检查 Python 语法
        run: python -m compileall -q kgqa tests

      - name: 检查致命代码错误
        run: python -m ruff check --no-cache --select E9,F63,F7,F82 kgqa tests

      - name: 检查命令行入口
        run: |
          python -m kgqa.prepare --help
          python -m kgqa.pipeline --help
          python -m kgqa.demo --help
          python -m kgqa.acceptance --help
          python -m kgqa.web --help
          python -m kgqa.expand --help
          python -m kgqa.dataset --help
          python -m kgqa.freeform --help
          python -m kgqa.freeform_data --help
          python -m kgqa.v2_data --help
          python -m kgqa.explorer --help
          python -m kgqa.neural_preflight --help
          python -m kgqa.recovery_experiment --help
          python -m kgqa.expanded_evaluation --help
          python -m kgqa.expanded_suite --help

      - name: 运行核心测试
        run: python -m pytest -q

      - name: 校验完整5000部电影数据与配套模型
        run: python -m kgqa.dataset verify --smoke

      - name: 离线训练与问答验收
        run: python -m kgqa.acceptance --output-dir output/acceptance/ci

      - name: 检查 PowerShell 脚本语法
        shell: pwsh
        run: |
          $hasErrors = $false
          Get-ChildItem -LiteralPath scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            foreach ($parseError in $parseErrors) {
              Write-Output ("{0}:{1}: {2}" -f $_.FullName, $parseError.Extent.StartLineNumber, $parseError.Message)
              $hasErrors = $true
            }
          }
          if ($hasErrors) { exit 1 }
